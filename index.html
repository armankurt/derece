<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Derece — Eğitim Platformu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============ TOKENS — açık tema varsayılan (ChatGPT × Apple) ============ */
:root{
  --bg:#FAFAFB; --surface:#FFFFFF; --surface2:#FCFCFD; --sunken:#F1F1F3; --side:#F7F7F8;
  --ink:#0D0D0F; --ink2:#5D5D63; --ink3:#9A9AA1;
  --line:#E3E3E7; --hairline:#EAEAEE;
  --accent:#0A63E9; --accent-hover:#0956CC; --on-accent:#FFFFFF;
  --accent-soft:rgba(10,99,233,.08); --accent-soft2:rgba(10,99,233,.16);
  --good:#1E8E48; --good-soft:#E8F6EE;
  --bad:#D63125; --bad-soft:#FCEDEB;
  --warn:#B26A00; --warn-soft:#FCF3E3;
  --violet:#6E43D9; --violet-soft:#F1EDFB;
  --teal:#0E8FA8;
  --btn:#0D0D0F; --btn-hover:#2D2D33; --on-btn:#FFFFFF;
  --shadow:0 1px 2px rgba(20,20,30,.04);
  --shadow-lg:0 8px 16px rgba(20,20,30,.07), 0 20px 48px rgba(20,20,30,.10);
  --grid-line:rgba(20,20,30,.055);
  --r:12px; --r-sm:8px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",ui-sans-serif,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#101012; --surface:#17171A; --surface2:#1C1C20; --sunken:#232327; --side:#131316;
  --ink:#F2F2F4; --ink2:#A2A2A9; --ink3:#66666E;
  --line:#2C2C31; --hairline:#232328;
  --accent:#4A8DF6; --accent-hover:#6AA2F8; --on-accent:#FFFFFF;
  --accent-soft:rgba(74,141,246,.13); --accent-soft2:rgba(74,141,246,.24);
  --good:#3DC46C; --good-soft:rgba(61,196,108,.13);
  --bad:#F0554A; --bad-soft:rgba(240,85,74,.13);
  --warn:#E8A13D; --warn-soft:rgba(232,161,61,.13);
  --violet:#9775F5; --violet-soft:rgba(151,117,245,.14);
  --teal:#3DB9D3;
  --btn:#F2F2F4; --btn-hover:#D9D9DE; --on-btn:#111114;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 8px 16px rgba(0,0,0,.4), 0 20px 48px rgba(0,0,0,.5);
  --grid-line:rgba(255,255,255,.06);
}

/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  font-size:13.5px; line-height:1.45; letter-spacing:-0.008em;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{font-weight:700;letter-spacing:-0.02em;text-wrap:balance;line-height:1.25}
svg{display:block}
::selection{background:var(--accent-soft2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:6px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}

/* ============ LOGIN — premium sahne ============ */
:root{
  --lg-glass:rgba(255,255,255,.62); --lg-bord:rgba(15,20,40,.09);
  --lg-glare:rgba(255,255,255,.55); --lg-ground:rgba(11,40,120,.22);
  --lg-cardsh:0 1px 2px rgba(20,20,40,.05),0 12px 32px -12px rgba(20,30,80,.12);
  --lg-marksh:drop-shadow(0 26px 44px rgba(11,55,200,.30));
}
:root[data-theme="dark"]{
  --lg-glass:rgba(22,24,34,.52); --lg-bord:rgba(255,255,255,.10);
  --lg-glare:rgba(255,255,255,.07); --lg-ground:rgba(0,0,0,.55);
  --lg-cardsh:0 1px 2px rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.6);
  --lg-marksh:drop-shadow(0 26px 50px rgba(30,90,255,.45));
}
.lg{position:relative;height:100vh;height:100svh;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
#lg-gl{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.lg.no-gl::before{content:"";position:absolute;inset:0;z-index:0;background:
  radial-gradient(50% 40% at 50% 16%,var(--accent-soft2),transparent 70%),
  radial-gradient(45% 42% at 15% 72%,var(--violet-soft),transparent 70%),
  radial-gradient(45% 42% at 85% 74%,rgba(43,212,196,.13),transparent 70%)}
.lg-fade{position:absolute;left:0;right:0;bottom:0;height:170px;z-index:1;pointer-events:none;background:linear-gradient(to top,var(--bg),transparent)}
.lg-top{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:10px;padding:15px clamp(16px,3vw,28px)}
.lg-brand{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-0.02em}
.lg-brand svg{border-radius:7px}
.lg-pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:99px;background:var(--lg-glass);border:1px solid var(--lg-bord);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink2);font-size:11.5px;font-weight:600}
.lg-theme{width:32px;height:32px;flex:none;border-radius:99px;display:flex;align-items:center;justify-content:center;background:var(--lg-glass);border:1px solid var(--lg-bord);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink2);transition:color .15s,border-color .15s}
.lg-theme:hover{color:var(--ink);border-color:var(--ink3)}
.lg-wrap{position:relative;z-index:2;flex:1;min-height:0;width:100%;max-width:1100px;margin:0 auto;padding:clamp(56px,8vh,80px) 24px clamp(10px,2.2vh,22px);display:flex;flex-direction:column;align-items:center;justify-content:center}
/* --- 3B sahne: yörünge + logo --- */
.lg-stage{position:relative;width:min(620px,94vw);height:clamp(148px,23vh,208px);perspective:900px;flex:none}
.lg-mark{position:absolute;left:50%;top:50%;z-index:3;filter:var(--lg-marksh);will-change:transform;transform:translate(-50%,-50%)}
.lg-mark svg{border-radius:26px}
.lg-ground{position:absolute;left:50%;top:calc(50% + 82px);width:190px;height:36px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(50% 50% at 50% 50%,var(--lg-ground),transparent 70%);filter:blur(7px)}
.lg-chip{position:absolute;left:50%;top:50%;opacity:0;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--lg-glass);border:1px solid var(--lg-bord);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--ink2);white-space:nowrap;will-change:transform,opacity;pointer-events:none}
.lg-chip i{width:7px;height:7px;border-radius:50%;display:block}
/* --- başlık --- */
.lg-eyebrow{margin-top:clamp(2px,1vh,10px);font-size:11.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);text-align:center}
.lg-h1{margin-top:clamp(6px,1.2vh,12px);text-align:center;font-size:clamp(32px,min(6vw,8vh),64px);font-weight:800;letter-spacing:-0.042em;line-height:1.03}
.lg-grad{background:linear-gradient(100deg,#3D9BFF 0%,#7C5CFF 48%,#2BD4C4 95%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:lgSheen 7s ease-in-out infinite alternate}
@keyframes lgSheen{to{background-position:100% 0}}
.lg-tag{margin-top:clamp(8px,1.5vh,15px);font-size:clamp(13.5px,1.6vw,16px);color:var(--ink2);max-width:52ch;text-align:center;text-wrap:balance}
/* --- rol kartları --- */
.lg-roles{margin-top:clamp(18px,3.8vh,40px);display:grid;grid-template-columns:repeat(4,minmax(0,236px));gap:12px;width:100%;justify-content:center}
.lgc{position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:10px;padding:16px 17px 14px;min-height:clamp(150px,21vh,184px);border-radius:20px;background:var(--lg-glass);border:1px solid var(--lg-bord);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:var(--lg-cardsh);transform:perspective(750px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--lift,0px));transition:border-color .25s,box-shadow .25s,transform .16s ease-out}
.lgc:hover{--lift:-5px;border-color:color-mix(in srgb,var(--hc) 50%,var(--lg-bord));box-shadow:0 26px 52px -22px color-mix(in srgb,var(--hc) 50%,transparent),var(--lg-cardsh)}
.lgc::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),var(--lg-glare),transparent 65%);opacity:0;transition:opacity .3s;pointer-events:none}
.lgc:hover::after{opacity:1}
.lgc-ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--hc1),var(--hc2));box-shadow:0 10px 18px -8px var(--hc2),inset 0 1px 0 rgba(255,255,255,.35)}
.lgc-adm{--hc:#8B5CF6;--hc1:#A78BFA;--hc2:#6D3BE0}
.lgc-tch{--hc:#3B82F6;--hc1:#60A5FA;--hc2:#1E5FE0}
.lgc-stu{--hc:#22B36B;--hc1:#4ADE8C;--hc2:#15915B}
.lgc-par{--hc:#F08149;--hc1:#FFAE73;--hc2:#E0662E}
.lgc-tag{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:1px}
.lgc-id{display:flex;flex-direction:column;gap:2px;margin-top:-4px}
.lgc-name{font-weight:700;font-size:15px;letter-spacing:-0.01em}
.lgc-sub{font-size:12px;color:var(--ink2);line-height:1.35}
.lgc-go{margin-top:auto;padding-top:8px;display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12.5px;color:var(--accent)}
.lgc-go svg{transition:transform .2s}
.lgc:hover .lgc-go svg{transform:translateX(3px)}
/* --- özellikler --- */
.lg-feats{margin-top:clamp(16px,3vh,30px);display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.lg-feat{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;background:var(--lg-glass);border:1px solid var(--lg-bord);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;font-weight:600;color:var(--ink2)}
.lg-feat svg{color:var(--accent)}
.lg-foot{margin-top:clamp(12px,2.4vh,26px);color:var(--ink3);font-size:11.5px;text-align:center}
/* --- açılış koreografisi --- */
.lg [data-rev]{opacity:0;animation:lgRev .9s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--d,0s)}
@keyframes lgRev{from{opacity:0;transform:translateY(24px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

/* ============ PORT + MOBİL DÜZELTMELER ============ */
button{appearance:none;-webkit-appearance:none}
.btn{align-self:center}
.strip-item{min-width:158px;overflow:hidden}
.strip-item .s-lab{overflow:hidden;text-overflow:ellipsis}
.strip-item .s-sub{overflow:hidden}
:root[data-theme="dark"] .toast .t-ico{color:#1E8E48}
:root[data-theme="dark"] .modal-veil{background:rgba(0,0,0,.62)}
.nav-item.danger{color:var(--bad)}
.nav-item.danger:hover{background:var(--bad-soft);color:var(--bad)}
.s-row .sr-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.s-row .sr-sub{white-space:nowrap}
.pager{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--hairline);flex-wrap:wrap}
.pager-nums{display:flex;gap:4px;margin:0 auto;flex-wrap:wrap;justify-content:center}
.pg-num{min-width:30px;height:30px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center}
.pg-num:hover{background:var(--sunken);color:var(--ink)}
.pg-num.on{background:var(--ink);color:var(--bg)}
.pg-dots{padding:0 3px;color:var(--ink3);align-self:center;font-size:12px}
@media(pointer: coarse){.list-search-card{display:none}}
@media(max-width:900px){
  :root[data-theme="dark"] .scrim{background:rgba(0,0,0,.62)}
  .sidebar{padding-bottom:max(14px,env(safe-area-inset-bottom))}
}
@media(max-width:700px){
  .entry-wrap{overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain}
  .entry-wrap .col-b{display:none}
  .entry-wrap .av{display:none}
  .entry-wrap th,.entry-wrap td{padding-left:7px;padding-right:7px}
  .entry-wrap .tn-t{max-width:104px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
  .cell-inp{width:38px}
}
@media(max-width:600px){
  .s-drop{left:auto;right:0;min-width:288px;max-width:92vw}
}
@media (prefers-reduced-motion: reduce){
  .lg [data-rev]{animation:none;opacity:1}
  .lg-grad{animation:none}
  .lgc,.lgc-go svg{transition:none}
}
/* dar ya da alçak pencerede tek ekran zorlanır — kaydırmaya geri dön */
@media(max-width:1020px),(max-height:640px){
  .lg{height:auto;min-height:100vh;min-height:100svh}
  .lg-wrap{justify-content:flex-start;padding-bottom:34px}
  .lgc{min-height:172px}
}
@media(max-width:1020px){.lg-roles{grid-template-columns:repeat(2,minmax(210px,250px))}}
@media(max-width:560px){
  .lg-wrap{padding-top:78px}
  .lg-roles{grid-template-columns:minmax(0,330px)}
  .lg-stage{height:196px}
  .lg-pill{font-size:10.5px;padding:4px 10px}
}

/* ============ AVATARS ============ */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none;letter-spacing:0}
.av-40{width:38px;height:38px;font-size:13px}
.av-32{width:28px;height:28px;font-size:10.5px}
.av-56{width:48px;height:48px;font-size:16px}
.av-g0{background:#3B76D3}.av-g1{background:#7A5BD0}.av-g2{background:#CE6A43}
.av-g3{background:#33996B}.av-g4{background:#C25577}.av-g5{background:#3F94B5}

/* ============ SHELL ============ */
.shell{display:flex;min-height:100vh}
.sidebar{width:232px;flex:none;padding:14px 10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--side);border-right:1px solid var(--hairline);position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 12px}
.brand .b-mark{width:26px;height:26px;border-radius:7px}
.brand .b-name{font-weight:800;font-size:15px;letter-spacing:-0.02em}
.brand .b-role{font-size:10px;color:var(--ink3);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding:12px 10px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-sm);color:var(--ink2);font-weight:500;font-size:13px;width:100%;text-align:left;transition:background .12s,color .12s}
.nav-item svg{flex:none;opacity:.85}
.nav-item:hover{background:var(--sunken);color:var(--ink)}
.nav-item.on{background:#ECECEF;color:var(--ink);font-weight:600}
:root[data-theme="dark"] .nav-item.on{background:var(--sunken)}
.nav-item .n-badge{margin-left:auto;background:var(--ink);color:var(--bg);font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:99px}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--hairline);display:flex;flex-direction:column;gap:2px}
.persona{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--r-sm)}
.persona .p-name{font-weight:600;font-size:12.5px;line-height:1.2}
.persona .p-sub{color:var(--ink3);font-size:10.5px;margin-top:1px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:8px 22px;background:var(--surface);border-bottom:1px solid var(--hairline);min-height:46px}
.tb-title{font-weight:700;font-size:14px;letter-spacing:-0.015em;white-space:nowrap}
.tb-crumb{color:var(--ink3);font-weight:500;font-size:12.5px}
.tb-spacer{flex:1}
.tb-search{position:relative;width:280px}
.tb-search input{width:100%;padding:6px 12px 6px 30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;outline:none;transition:border-color .15s,box-shadow .15s}
.tb-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tb-search .s-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
.s-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);overflow:hidden;max-height:360px;overflow-y:auto;z-index:60}
.s-row{display:flex;align-items:center;gap:10px;padding:8px 12px;width:100%;text-align:left}
.s-row:hover{background:var(--sunken)}
.s-row .sr-name{font-weight:600;font-size:12.5px}
.s-row .sr-sub{font-size:11px;color:var(--ink2)}
.s-row .sr-net{margin-left:auto;font-weight:700;font-size:12px;color:var(--ink2)}
.s-empty{padding:14px;text-align:center;color:var(--ink3);font-size:12.5px}
.icon-btn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:background .12s}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}

.content{padding:18px 22px 28px;max-width:1560px;width:100%;margin:0 auto}
.content.content-chat{padding:0;max-width:none;margin:0}
.content.content-chat .view{animation:none}
.view{animation:viewIn .2s ease}
@keyframes viewIn{from{opacity:0}to{opacity:1}}

/* ============ STAT STRIP ============ */
.strip{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 4px;margin-bottom:14px;overflow-x:auto}
.strip-item{flex:1;min-width:108px;padding:2px 18px;border-left:1px solid var(--hairline)}
.strip-item:first-child{border-left:none}
.strip-item .s-lab{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.strip-item .s-val{font-size:19px;font-weight:800;letter-spacing:-0.02em;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.strip-item .s-val .unit{font-size:12px;font-weight:600;color:var(--ink3)}
.strip-item .s-sub{font-size:11px;color:var(--ink2);margin-top:2px;white-space:nowrap;display:flex;align-items:center;gap:5px}

/* ============ CARDS & GRID ============ */
.grid{display:grid;gap:12px}
.grid>*{min-width:0}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-1{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-subj{grid-template-columns:repeat(3,1fr)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card.flat{box-shadow:none}
.card.pad-0{padding:0;overflow:hidden}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-title{font-size:13px;font-weight:700;letter-spacing:-0.01em}
.card-sub{font-size:11.5px;color:var(--ink2);width:100%;margin-top:-4px}
.card-head .spacer{flex:1}
.page-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-head h2{font-size:19px;font-weight:800;letter-spacing:-0.02em}
.page-head .ph-sub{color:var(--ink2);font-size:12.5px;margin-top:2px}
.page-head .spacer{flex:1}
.kpi .k-label{font-size:11px;font-weight:700;color:var(--ink3);display:flex;align-items:center;gap:6px;letter-spacing:.03em;text-transform:uppercase}
.kpi .k-value{font-size:22px;font-weight:800;letter-spacing:-0.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .k-unit{font-size:12.5px;font-weight:600;color:var(--ink3);margin-left:2px}

function makeStudents(){
  const used=new Set(Object.values(HEROES).map(h=>h.name));
  const out=[]; let sid=0;
  CLASSES.forEach((cls,ci)=>{
    const heroesHere=Object.values(HEROES).filter(h=>h.cls===cls);
    const n=28;
    for(let k=0;k<n;k++){
      const hero=heroesHere.find(h=>!h._placed && k===(h===HEROES.student?3:h===HEROES.top?0:5));
      let st;
      if(hero){ hero._placed=true;
        st={id:sid, name:hero.name, cls, no:hero.no, ability:hero.ability, trend:hero.trend, vol:hero.vol, bias:hero.bias};
      } else {
        let nm; let guard=0;
        do{ nm=FIRSTS[Math.floor(rnd()*FIRSTS.length)]+' '+LASTS[Math.floor(rnd()*LASTS.length)]; guard++; }while(used.has(nm)&&guard<50);
        used.add(nm);
        const bias={}; SUBJECTS.forEach(s=>bias[s.key]=(rnd()-.5)*.24);
        st={id:sid, name:nm, cls, no:401+ci*40+k, ability:.28+rnd()*.62, trend:(rnd()-.46)*.05, vol:.03+rnd()*.06, bias};
      }
      st.parentName=(st.name===HEROES.student.name)?PARENT.name:(FIRSTS[Math.floor(rnd()*FIRSTS.length)]+' '+st.name.split(' ').slice(-1)[0]);
      st.absentAt = rnd()<.10 ? Math.floor(rnd()*10) : -1;   // bazıları 1 denemeye girmemiş
      if(Object.values(HEROES).some(h=>h.name===st.name)) st.absentAt=-1;
      out.push(st); sid++;
    }
  });
  return out;
}

function genResult(st,exam,t){
  const noise=()=> (rnd()*2-1)*st.vol;
  const subj={};
  SUBJECTS.forEach(s=>{
    const p=clamp(st.ability + st.trend*t + (st.bias[s.key]||0) + noise(), .04, .985)*exam.diff;
    let d=Math.round(s.max*clamp(p,.02,1));
    d=clamp(d,0,s.max);
    const rest=s.max-d;
    let y=Math.round(rest*(.5+rnd()*.4));
    y=clamp(y,0,rest);
    const b=rest-y;
    subj[s.key]={d,y,b,net:+(d-y/3).toFixed(2)};
  });
  const totD=SUBJECTS.reduce((a,s)=>a+subj[s.key].d,0);
  const totY=SUBJECTS.reduce((a,s)=>a+subj[s.key].y,0);
  const net=+SUBJECTS.reduce((a,s)=>a+subj[s.key].net,0).toFixed(2);
  const wnet=SUBJECTS.reduce((a,s)=>a+subj[s.key].net*s.coef,0);
  const lgs=+clamp(100+400*(wnet/WMAX),100,500).toFixed(3);
  return {sid:st.id, eid:exam.id, subj, totD, totY, net, lgs};
}

function computeExam(exam,t){
  const res={};
  STUDENTS.forEach(st=>{ if(st.absentAt!==exam.id) res[st.id]=genResult(st,exam,t); });
  RESULTS[exam.id]=res;
  recomputeStats(exam);
}
function recomputeStats(exam){
  const res=RESULTS[exam.id];
  const ids=Object.keys(res).map(Number);
  const ranked=[...ids].sort((a,b)=>res[b].lgs-res[a].lgs);
  const rankedByClass={};
  CLASSES.forEach(c=>{ rankedByClass[c]=ranked.filter(id=>STUDENTS[id].cls===c); });
  const avg=arr=>arr.reduce((a,b)=>a+b,0)/(arr.length||1);
  const mkAvg=list=>{
    const o={net:+avg(list.map(id=>res[id].net)).toFixed(2), lgs:+avg(list.map(id=>res[id].lgs)).toFixed(1), subj:{}};
    SUBJECTS.forEach(s=>o.subj[s.key]=+avg(list.map(id=>res[id].subj[s.key].net)).toFixed(2));
    return o;
  };
  const classAvg={}; CLASSES.forEach(c=>classAvg[c]=mkAvg(rankedByClass[c]));
  EXAM_STATS[exam.id]={schoolAvg:mkAvg(ids), classAvg, ranked, rankedByClass, participation:ids.length};
}

function ranksOf(sid,eid){
  const S=EXAM_STATS[eid]; if(!S||!RESULTS[eid][sid]) return null;
  const st=stById(sid);

  }
  return {cls:cr, clsN:S.rankedByClass[st.cls].length, sch:sr, schN:S.ranked.length, il, gen, genN:ex.gk||null};
}

/* --- analiz motoru (AI insight + chat ortak) --- */
function analyze(sid){
  const st=stById(sid);
  const ser=studentSeries(sid);
  const last=ser[ser.length-1], first=ser[0];
  const prev=ser.length>1?ser[ser.length-2]:null;
  const rk=ranksOf(sid,last.exam.id);
  const n=ser.length;
  const half=Math.max(1,Math.floor(n/2));
  const avgN=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
  const firstHalf=avgN(ser.slice(0,half).map(x=>x.r.net));
  const lastHalf=avgN(ser.slice(-half).map(x=>x.r.net));
  const momentum=+(lastHalf-firstHalf).toFixed(1);
  const seasonDelta=+(last.r.net-first.r.net).toFixed(1);
  const lastDelta=prev? +(last.r.net-prev.r.net).toFixed(1):0;
  // ders bazlı: son 2 deneme ort vs sınıf ort
  const subjEval=SUBJECTS.map(s=>{
    const mineLast2=avgN(ser.slice(-2).map(x=>x.r.subj[s.key].net));
    const clsLast2=avgN(ser.slice(-2).map(x=>x.stats.classAvg[st.cls].subj[s.key]));
    const mineFirst2=avgN(ser.slice(0,2).map(x=>x.r.subj[s.key].net));
    return {s, mine:+mineLast2.toFixed(1), cls:+clsLast2.toFixed(1), diff:+(mineLast2-clsLast2).toFixed(1), grow:+(mineLast2-mineFirst2).toFixed(1)};
  });
  const sorted=[...subjEval].sort((a,b)=>b.diff-a.diff);
  const strengths=sorted.filter(x=>x.diff>=0.8).slice(0,2);
  const weaks=[...sorted].reverse().filter(x=>x.diff<=-0.5).slice(0,2);
  const bestGrow=[...subjEval].sort((a,b)=>b.grow-a.grow)[0];
  const nets=ser.map(x=>x.r.net);
  const mean=avgN(nets);
  // istikrar: trendden arındırılmış artık sapma (yükselen öğrenci "dalgalı" sayılmasın)
  const xs=nets.map((_,i)=>i), mx=avgN(xs);
  const slope=xs.reduce((a,x,i)=>a+(x-mx)*(nets[i]-mean),0)/(xs.reduce((a,x)=>a+(x-mx)*(x-mx),0)||1);
  const sd=Math.sqrt(avgN(nets.map((v,i)=>{const e=v-(mean+slope*(i-mx));return e*e;})));
  const consistency= sd<3 ? 'istikrarlı' : sd<5.5 ? 'dalgalı' : 'çok dalgalı';
  const firstRk=ranksOf(sid,first.exam.id);
  const rankMove=firstRk&&rk? firstRk.cls-rk.cls : 0;
  const proj=+clamp(last.r.lgs + momentum*4.3, 100, 500).toFixed(0);
  return {st,ser,last,first,prev,rk,momentum,seasonDelta,lastDelta,subjEval,strengths,weaks,bestGrow,sd:+sd.toFixed(1),consistency,rankMove,proj,avgNet:+mean.toFixed(1)};
}

  const reg=CHARTS[box.dataset.chart]; if(!reg||box._chBound) return; box._chBound=true;
  const tip=box.querySelector('.ch-tip'), guide=box.querySelector('.ch-guide');
  const xs=reg.type==='line'?reg.gx:reg.centers;
  const move=ev=>{
    const r=box.getBoundingClientRect(); if(!r.width) return;
    const vx=(ev.clientX-r.left)/r.width*reg.W;
    let idx=0,best=1e9;
    xs.forEach((x,i)=>{const d=Math.abs(x-vx); if(d<best){best=d;idx=i;}});
    const pct=xs[idx]/reg.W*100;
    if(reg.type==='line'&&guide){
      guide.style.display='block'; guide.style.left=pct+'%';
      guide.style.top=(reg.pt/reg.H*100)+'%'; guide.style.bottom=(reg.pb/reg.H*100)+'%';
    }
    let rows='';
    if(reg.type==='line'){
      reg.series.forEach(s=>{const p=s.pts[idx];
        rows+=`<div class="ct-row"><span class="ct-dot" style="background:${s.color}"></span>${esc(s.label)}<b>${p?fmt1(p.v):'—'}</b></div>`;});
    } else {
      const it=reg.items[idx];
      rows+=`<div class="ct-row"><span class="ct-dot" style="background:${it.color||'var(--accent)'}"></span>${esc(reg.aLabel)}<b>${fmt1(it.a)}</b></div>`;
      if(it.b!==undefined&&it.b!==null) rows+=`<div class="ct-row"><span class="ct-dot" style="background:var(--ink3)"></span>${esc(reg.bLabel||'Karşılaştırma')}<b>${fmt1(it.b)}</b></div>`;
    }
    tip.innerHTML=`<div class="ct-title">${esc(reg.titles[idx]??'')}</div>${rows}`;
    tip.style.display='block';
    if(pct>60){ tip.style.left='auto'; tip.style.right=(100-pct+1.5)+'%'; }
    else { tip.style.right='auto'; tip.style.left=(pct+1.5)+'%'; }
    box.querySelectorAll('.ch-pt').forEach(d=>d.remove());
    if(reg.type==='line') reg.series.forEach(s=>{const p=s.pts[idx]; if(!p)return;
      const d=document.createElement('i'); d.className='ch-pt';
      d.style.left=(p.x/reg.W*100)+'%'; d.style.top=(p.y/reg.H*100)+'%'; d.style.background=s.color;
      box.appendChild(d);});
  };
  box.addEventListener('pointermove',move);
  box.addEventListener('pointerleave',()=>{tip.style.display='none';if(guide)guide.style.display='none';box.querySelectorAll('.ch-pt').forEach(d=>d.remove());});
}
function lineChart(seriesArr,opts={}){
  // seriesArr: [{label, points:[{x,y}|null], color, dash, area}]
  const W=opts.w||640, H=opts.h||240, P={t:14,r:16,b:26,l:34};
  const allY=seriesArr.flatMap(s=>s.points.filter(Boolean).map(p=>p.y));
  let yMin=opts.yMin!==undefined?opts.yMin:Math.floor(Math.min(...allY)-4);
  let yMax=opts.yMax!==undefined?opts.yMax:Math.ceil(Math.max(...allY)+4);
  if(yMax-yMin<8){yMax+=4;yMin-=4;}
  // veri negatifse taban da negatife inebilsin; aksi halde 0'da (veya opts.floor'da) kes
  const fl=opts.floor!==undefined?opts.floor:(Math.min(...allY)<0?Math.floor(Math.min(...allY))-2:0);
  yMin=Math.max(fl,yMin);
  const N=Math.max(...seriesArr.map(s=>s.points.length));
  const gx=i=>P.l+(W-P.l-P.r)*(N<2?0.5:i/(N-1));
  const gy=v=>P.t+(H-P.t-P.b)*(1-(v-yMin)/(yMax-yMin||1));
  const ticks=4; let grid='',ylab='';
  for(let i=0;i<=ticks;i++){
    const v=yMin+(yMax-yMin)*i/ticks, y=gy(v);
    grid+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--grid-line)" stroke-width="1"/>`;
    ylab+=`<text x="${P.l-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--ink3)" class="num">${fmt0(v)}</text>`;
  }
  let xlab='';
  (opts.xLabels||[]).forEach((lb,i)=>{
    if(N>6 && i%2===1 && i!==N-1) return;
    xlab+=`<text x="${gx(i)}" y="${H-7}" text-anchor="middle" font-size="10.5" fill="var(--ink3)">${esc(lb)}</text>`;
  });
  let defs='',body='';
  seriesArr.forEach((s,si)=>{
    const pts=s.points.map((p,i)=>p?[gx(i),gy(p.y)]:null);
    let d='',started=false;
    pts.forEach(pt=>{ if(!pt){started=false;return;} d+=(started?' L':' M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1); started=true; });
    if(s.area){
      const solid=pts.filter(Boolean);
      if(solid.length>1){
        const aid='ar'+si+(opts.uid||'');
        defs+=`<linearGradient id="${aid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".16"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`;
        body+=`<path class="fade-in" d="${d} L ${solid[solid.length-1][0].toFixed(1)} ${H-P.b} L ${solid[0][0].toFixed(1)} ${H-P.b} Z" fill="url(#${aid})"/>`;
      }
    }
    body+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.4}" ${s.dash?'stroke-dasharray="5 5"':''} stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw-line"/>`;
    if(!s.noDots){
      pts.forEach((pt,i)=>{ if(!pt)return; const lastPt=i===pts.length-1;
        body+=`<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="${lastPt?4.5:3}" fill="${lastPt?s.color:'var(--surface)'}" stroke="${s.color}" stroke-width="2" class="fade-in"/>`;
        if(lastPt&&s.tagLast!==false){
          const v=s.points[i].y;
          body+=`<text x="${pt[0].toFixed(1)}" y="${(pt[1]-11).toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${s.color}" class="fade-in num">${fmt1(v)}</text>`;
        }
      });
    }
  });
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="çizgi grafik"><defs>${defs}</defs>${grid}${ylab}${xlab}${body}</svg>`;
  const reg={type:'line',W,H,pt:P.t,pb:P.b,
    gx:[...Array(N)].map((_,i)=>gx(i)),
    titles:(opts.titles||opts.xLabels||[]).slice(),
    series:seriesArr.map(s=>({label:s.label,color:s.color,
      pts:s.points.map((p,i)=>p?{x:gx(i),y:gy(p.y),v:p.y}:null)}))};
  return chartWrap(svg,reg);
}

function groupBars(items,opts={}){
  // items: [{label, a, b}]  a=öğrenci/sınıf, b=karşılaştırma
  const W=opts.w||640,H=opts.h||220,P={t:18,r:8,b:26,l:36};
  const fmt=opts.fmt||fmt1;
  const vals=items.flatMap(x=>[x.a,x.b]).filter(v=>v!==undefined&&v!==null);
  const maxV=Math.max(...vals), minV=Math.min(...vals);
  // değerler kümelenmişse eksen 0'dan değil, akıllı bir tabandan başlasın — farklar görünür olsun
  let base=opts.base;
  if(base===undefined){
    if(minV>0 && (maxV-minV)/maxV<0.35){
      const span=Math.max(maxV-minV, maxV*.05);
      base=Math.max(0, Math.floor((minV-span*0.9)/5)*5);
    } else base=0;
  }
  let max=opts.max!==undefined?opts.max : (base>0 ? maxV+(maxV-base)*0.14 : maxV*1.1);
  if(max<=base) max=base+1;
  const bw=(W-P.l-P.r)/items.length;
  const gy=v=>P.t+(H-P.t-P.b)*(1-(clamp(v,base,max)-base)/(max-base));
  let out=''; const centers=[];
  for(let i=0;i<=3;i++){const v=base+(max-base)*i/3,y=gy(v);
    out+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--grid-line)"/><text x="${P.l-7}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--ink3)" class="num">${fmt0(v)}</text>`;}
  items.forEach((it,i)=>{
    const cx=P.l+bw*i+bw/2; centers.push(cx);
    const hasB=it.b!==undefined&&it.b!==null;
    const w1=hasB?Math.min(30,bw*.34):Math.min(48,bw*.55);
    const x1=hasB?cx-w1-2:cx-w1/2;
    out+=`<rect x="${x1.toFixed(1)}" y="${gy(it.a).toFixed(1)}" width="${w1.toFixed(1)}" height="${(H-P.b-gy(it.a)).toFixed(1)}" rx="6" fill="${it.color||'var(--accent)'}" class="fade-in"/>`;
    if(hasB) out+=`<rect x="${(cx+2).toFixed(1)}" y="${gy(it.b).toFixed(1)}" width="${w1.toFixed(1)}" height="${(H-P.b-gy(it.b)).toFixed(1)}" rx="6" fill="var(--ink3)" opacity=".35" class="fade-in"/>`;
    out+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink2)">${esc(it.label)}</text>`;
    out+=`<text x="${hasB?(x1+w1/2).toFixed(1):cx}" y="${(gy(it.a)-7).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)" class="num fade-in">${fmt(it.a)}</text>`;
  });
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="sütun grafik">${out}</svg>`;
  return chartWrap(svg,{type:'bars',W,H,centers,items:items.map(it=>({...it})),
    titles:opts.titles||items.map(it=>String(it.label)),
    aLabel:opts.aLabel||'Değer', bLabel:opts.bLabel, fmt});
}

function sparkline(vals,opts={}){
  const W=opts.w||96,H=opts.h||30,pad=3;
  if(!vals.length) return '';
  const mn=Math.min(...vals),mx=Math.max(...vals);
  const gx=i=>pad+(W-2*pad)*(vals.length<2?.5:i/(vals.length-1));
  const gy=v=>pad+(H-2*pad)*(1-(v-mn)/((mx-mn)||1));
  const up=vals[vals.length-1]>=vals[0];
  const col=opts.color||(up?'var(--good)':'var(--bad)');
  let d='';vals.forEach((v,i)=>d+=(i?' L':'M')+gx(i).toFixed(1)+' '+gy(v).toFixed(1));
  const lx=gx(vals.length-1),ly=gy(vals[vals.length-1]);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.6" fill="${col}"/></svg>`;
}

function donut(pct,opts={}){
  const s=opts.size||56,r=(s-8)/2,c=2*Math.PI*r;
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" aria-hidden="true">
    <circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="var(--sunken)" stroke-width="6"/>
    <circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="${opts.color||'var(--accent)'}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${(c*pct).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${s/2} ${s/2})" class="fade-in"/>
    <text x="50%" y="53%" dominant-baseline="middle" text-anchor="middle" font-size="${s*.21}" font-weight="800" fill="var(--ink)" class="num">%${Math.round(pct*100)}</text></svg>`;
}

/* --- giriş ekranı efekt motoru: WebGL aurora + 3B yörünge + kart tilt --- */
let LGFX=null;
function stopLoginFX(){
  if(!LGFX) return;
  cancelAnimationFrame(LGFX.raf);
  LGFX.un.forEach(f=>f());
  LGFX=null;
}
function initLoginFX(){
  stopLoginFX();
  const rootEl=document.querySelector('.lg'); if(!rootEl) return;
  const un=[]; LGFX={raf:0,un};
  const on=(t,ev,fn,o)=>{t.addEventListener(ev,fn,o); un.push(()=>t.removeEventListener(ev,fn,o));};
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // açılış animasyonu bitince data-rev kalksın ki kart tilt transform'u serbest kalsın
  rootEl.querySelectorAll('[data-rev]').forEach(el=>{
    if(reduced){el.removeAttribute('data-rev');return;}
    el.addEventListener('animationend',()=>el.removeAttribute('data-rev'),{once:true});
  });

  /* --- WebGL aurora zemin --- */
  const cv=document.getElementById('lg-gl');
  let gl=null,uT,uR,uD;
  try{
    gl=cv.getContext('webgl',{antialias:false,alpha:false,powerPreference:'low-power'});
    if(gl){
      const VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
      const FS=`precision highp float;uniform vec2 R;uniform float T;uniform float D;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float fb(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(17.,9.);a*=.52;}return v;}
void main(){
vec2 p=(gl_FragCoord.xy-.5*R)/min(R.x,R.y);
float t=T*.05;
vec2 q=vec2(fb(p*1.4+vec2(t*.9,.3*t)),fb(p*1.4-vec2(.4*t,t*.8)));
float f=fb(p*1.6+2.1*q+vec2(-t*.8,t*.5));
float g=fb(p*2.4-1.7*q+vec2(t*.6,-t*.35));
float m=fb(p*2.+3.*q+vec2(t*.25,t*.2));
vec3 base=mix(vec3(.972,.977,.992),vec3(.036,.045,.10),D);
vec3 c1=mix(vec3(.784,.878,1.),vec3(.08,.30,.92),D);
vec3 c2=mix(vec3(.898,.862,1.),vec3(.40,.26,.88),D);
vec3 c3=mix(vec3(.835,.949,.933),vec3(.03,.55,.52),D);
vec3 col=base;
col=mix(col,c1,smoothstep(.32,.9,f)*mix(.9,.6,D));
col=mix(col,c2,smoothstep(.42,.95,g)*mix(.75,.5,D));
col=mix(col,c3,smoothstep(.5,1.,m)*mix(.55,.35,D));
vec2 hp=p-vec2(0.,.24);
col+=mix(vec3(.03,.02,.05),vec3(.09,.14,.30),D)*exp(-dot(hp,hp)*3.2);
float v=smoothstep(1.6,.4,length(p));
col=mix(base*mix(1.,.6,D),col,v);
float sh=h(floor(gl_FragCoord.xy/2.));
col+=vec3(smoothstep(.9985,1.,sh)*(.5+.5*sin(T*1.3+sh*60.))*D*.6);
col+=(h(gl_FragCoord.xy+fract(T)*7.)-.5)*.018;
gl_FragColor=vec4(col,1.);}`;
      const sh=(ty,src)=>{const s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);
        if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s;};
      const pr=gl.createProgram();
      gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
      gl.linkProgram(pr);
      if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw gl.getProgramInfoLog(pr);
      gl.useProgram(pr);
      const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      const loc=gl.getAttribLocation(pr,'p');
      gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
      uT=gl.getUniformLocation(pr,'T'); uR=gl.getUniformLocation(pr,'R'); uD=gl.getUniformLocation(pr,'D');
    }
  }catch(e){ gl=null; }
  if(!gl){ cv.remove(); rootEl.classList.add('no-gl'); }
  const dpr=Math.min(window.devicePixelRatio||1,1.6);
  const size=()=>{ if(!gl) return; cv.width=Math.max(2,rootEl.clientWidth*dpr); cv.height=Math.max(2,rootEl.clientHeight*dpr); gl.viewport(0,0,cv.width,cv.height); };
  size(); on(window,'resize',size);

  /* --- 3B yörünge + logo paralaks --- */
  const stage=document.getElementById('lg-stage');
  const mark=document.getElementById('lg-mark');
  const chips=[...rootEl.querySelectorAll('.lg-chip')];
  let tx=0,ty=0,cx=0,cy=0;
  on(rootEl,'pointermove',e=>{ const r=rootEl.getBoundingClientRect();
    tx=((e.clientX-r.left)/r.width-.5)*2; ty=((e.clientY-r.top)/r.height-.5)*2; });
  on(rootEl,'pointerleave',()=>{tx=0;ty=0;});

  /* --- kart tilt + parlama --- */
  if(!reduced) rootEl.querySelectorAll('.lgc').forEach(card=>{
    on(card,'pointermove',e=>{ const r=card.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
      card.style.setProperty('--rx',((py-.5)*-9).toFixed(2)+'deg');
      card.style.setProperty('--ry',((px-.5)*10).toFixed(2)+'deg');
      card.style.setProperty('--mx',(px*100).toFixed(1)+'%');
      card.style.setProperty('--my',(py*100).toFixed(1)+'%');
    });
    on(card,'pointerleave',()=>{card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg');});
  });

  const t0=performance.now();
  const frame=now=>{
    const T=(now-t0)/1000;
    if(gl){ gl.uniform1f(uT,reduced?12:T); gl.uniform2f(uR,cv.width,cv.height); gl.uniform1f(uD,isDarkNow()?1:0); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); }
    if(stage){
      const R=stage.clientWidth*.46, Rv=stage.clientHeight*.30;
      const a0=reduced?.6:T*.28;
      chips.forEach((c,i)=>{
        const a=a0+i*Math.PI*2/chips.length, z=Math.cos(a);
        const d=(z+1)/2;                       // 0 arka — 1 ön
        c.style.transform=`translate(-50%,-50%) translate(${(Math.sin(a)*R).toFixed(1)}px,${(z*Rv).toFixed(1)}px) scale(${(.7+.32*d).toFixed(3)})`;
        c.style.opacity=(.35+.6*d).toFixed(2);
        c.style.zIndex=z>0?4:1;
        c.style.filter=`blur(${((1-d)*1.6).toFixed(2)}px)`;
      });
      if(mark){
        cx+=(tx-cx)*.06; cy+=(ty-cy)*.06;
        const fy=reduced?0:Math.sin(T*1.4)*7;
        mark.style.transform=`translate(-50%,-50%) translateY(${fy.toFixed(1)}px) rotateY(${(cx*10).toFixed(2)}deg) rotateX(${(-cy*8).toFixed(2)}deg)`;
      }
    }
    if(!reduced) LGFX.raf=requestAnimationFrame(frame);
  };
  LGFX.raf=requestAnimationFrame(frame);
}

function trendPick(){
  // en çok yükselen / düşen (son 3 vs ilk 3 net ort)
  const scored=STUDENTS.map(st=>{
    const ser=studentSeries(st.id); if(ser.length<4) return null;
    const a=ser.slice(0,3).reduce((x,y)=>x+y.r.net,0)/3;
    const b=ser.slice(-3).reduce((x,y)=>x+y.r.net,0)/3;
    return {st, d:+(b-a).toFixed(1), nets:ser.map(x=>x.r.net)};
  }).filter(Boolean);
  scored.sort((a,b)=>b.d-a.d);
  const le=lastExam(); const topSid=EXAM_STATS[le.id].ranked[0];
  return {rise:scored[0], fall:scored[scored.length-1], top:{st:stById(topSid), r:RESULTS[le.id][topSid], nets:studentSeries(topSid).map(x=>x.r.net)}};
}

        <button class="btn ghost sm" data-act="list-page" data-p="${pg-1}" ${pg<=1?'disabled':''}>← Önceki</button>
        <div class="pager-nums">${nums.map(n=>n==='…'?`<span class="pg-dots">…</span>`:`<button class="pg-num ${n===pg?'on':''}" data-act="list-page" data-p="${n}">${n}</button>`).join('')}</div>
        <button class="btn ghost sm" data-act="list-page" data-p="${pg+1}" ${pg>=totalP?'disabled':''}>Sonraki →</button>
      </div>
      <div class="xs mut3" style="text-align:center;padding:0 14px 10px">${(pg-1)*PAGE+1}–${Math.min(pg*PAGE,total)} arası gösteriliyor · toplam ${total} öğrenci</div>`;})()}
  </div>`;
}

async function runWizard(){
  const body=document.getElementById('wiz-body'); if(!body) return;
  const steps=[
    {t:'6SINIF_TG5.xlsx okunuyor', s:'168 satır · 16 sütun algılandı'},
    {t:'Sınav tanımlandı', s:'Panorama Yayınları · Türkiye Geneli 5 · 7 Haz 2026'},
    {t:'Öğrenciler eşleştirildi', s:'140 öğrenci · 5 sınıf · 2 isim okul numarasıyla eşleştirildi'},
    {t:'Netler ve sıralamalar hesaplandı', s:'Ders netleri, LGS puanı, sınıf/okul dereceleri'},
  ];
  const draw=(k)=>{
    body.innerHTML=`<div class="steps">${steps.map((x,i)=>`
      <div class="step ${i<k?'done':i===k?'run':'idle'}">
        <div class="st-dot">${i<k?I.check(14):i===k?`<span class="spin">${I.spinner(14)}</span>`:i+1}</div>
        <div><div class="st-t">${x.t}${i===k?'…':''}</div>${i<k?`<div class="st-s">${x.s}</div>`:''}</div></div>`).join('')}</div>`;
  };
  for(let k=0;k<=steps.length;k++){ draw(k); await sleep(k===0?500:820); }
  // önizleme
  const ex=IMPORT_EXAM;
  const prev=EXAM_STATS[ex.id].ranked.slice(0,8);
  body.innerHTML=`

    <div style="height:14px"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap">

      <button class="btn primary big" data-act="wiz-import">${I.check(15)} 140 öğrenciyi içe aktar</button></div>`;

function insightHTML(A,mode){
  const st=A.st; const first=st.name.split(' ')[0];
  const momTxt=A.momentum>1.5?`belirgin bir yükseliş eğiliminde`:A.momentum<-1.5?`son denemelerde gerileme eğiliminde`:`istikrarlı bir seyirde`;
  const secs=[];
  if(mode==='veli'||mode==='veli-self'){
    secs.push({h:'Genel değerlendirme', ico:I.info(14), p:`${st.name}, ${A.ser.length} denemenin tamamı değerlendirildiğinde ${fmt1(A.avgNet)} net ortalamasıyla ${momTxt}. Son denemede ${fmt1(A.last.r.net)} net yaparak sınıfında ${A.rk.cls}., okulda ${A.rk.sch}. sırada yer aldı.${A.rankMove>0?` Dönem başından bu yana sınıf sıralamasında ${A.rankMove} basamak yükseldi.`:''}`});
    secs.push({h:'Görüşmede vurgulanabilecekler', ico:I.check(14), cls:'good', list:[
      A.strengths[0]?`${A.strengths[0].s.name} dersinde sınıf ortalamasının ${fmt1(A.strengths[0].diff)} net üzerinde — bu başarıyı takdir edin.`:`Tüm derslerde dengeli bir profil sergiliyor.`,
      A.bestGrow.grow>0.5?`En hızlı gelişim ${A.bestGrow.s.name} dersinde: dönem başına göre +${fmt1(A.bestGrow.grow)} net.`:`Netleri dönem boyunca korunuyor; düzenli çalışma alışkanlığı yerleşmiş.`,
      `Deneme katılımı ${A.ser.length}/${EXAM_LIST.length} — sınav disiplini ${A.ser.length===EXAM_LIST.length?'tam':'iyi düzeyde'}.`]});
    secs.push({h:'Evde destek önerileri', ico:I.star(14), list:[
      A.weaks[0]?`${A.weaks[0].s.name}: haftada 3 gün, 20 dakikalık konu tekrarı + 10 soru rutini önerilir.`:`Mevcut çalışma düzenini koruması yeterli.`,
      `Yanlış analizi: her deneme sonrası ${first} ile birlikte yanlış sorulara 15 dakika ayırın.`,
      `Uyku ve ekran düzeni: sınav haftalarında geç saatlere kalan ekran süresini sınırlandırmak odaklanmayı artırır.`]});
    secs.push({h:'Not', ico:I.users(14), note:`Bu özet, ${st.name} adlı öğrencinin ${A.ser.length} deneme sonucundaki eğilimlerden otomatik üretilmiştir. Ayrıntılı görüşme için rehber öğretmen Elif Yalçın ile hafta içi 13.00–15.00 arasında randevu oluşturabilirsiniz.`});
  } else {
    secs.push({h:'Genel durum', ico:I.info(14), p:`${st.name} (${st.cls}, No ${st.no}) dönem boyunca ${A.ser.length} denemeye katıldı ve ${fmt1(A.avgNet)} net ortalaması yakaladı. Profil ${A.consistency}; ilk yarıya kıyasla son denemelerde ${A.momentum>=0?'+':''}${fmt1(A.momentum)} netlik bir ivme görülüyor. Son deneme LGS karşılığı ${fmt1(A.last.r.lgs)} puan; eğilim korunursa dönem sonu projeksiyonu ${fmt0(Math.max(100,A.proj-8))}–${fmt0(Math.min(500,A.proj+8))} bandında.`});
    secs.push({h:'Güçlü yönler', ico:I.trendUp(14), cls:'good', list:[
      ...A.strengths.map(x=>`${x.s.name}: son iki denemede ${fmt1(x.mine)} net ortalama — sınıf ortalamasının ${fmt1(x.diff)} net üzerinde.`),
      A.bestGrow.grow>0.5?`${A.bestGrow.s.name} dersinde dönem başına göre +${fmt1(A.bestGrow.grow)} netlik gelişim.`:null,
      A.rankMove>0?`Sınıf sıralamasında dönem başından bu yana ${A.rankMove} basamak yükseliş.`:null].filter(Boolean)});
    secs.push({h:'Gelişim alanları', ico:I.warn(14), cls:'warn', list:[
      ...A.weaks.map(x=>`${x.s.name}: son iki denemede ${fmt1(x.mine)} net — sınıf ortalamasının ${fmt1(Math.abs(x.diff))} net altında.`),
      A.sd>5?`Denemeler arası net farkı yüksek (±${fmt1(A.sd)}); sınav kaygısı veya süre yönetimi incelenebilir.`:null,
      A.weaks.length===0?`Belirgin zayıf ders yok; hedef, güçlü derslerde tavan neti zorlamak.`:null].filter(Boolean)});
    secs.push({h:'Öneriler', ico:I.star(14), list:[
      A.weaks[0]?`${A.weaks[0].s.name} için haftalık 3×20 dk konu tekrarı + hedefli soru çözümü planlanmalı.`:`Genel tekrar programına devam edilmeli.`,
      `Yanlış/boş analizi: son denemede ${A.last.r.totY} yanlış var; yanlış başına dönüş rutini net kazancını hızlandırır.`,
      `Bir sonraki denemede hedef: ${fmt1(A.last.r.net+2.5)} net (+2,5).`]});
    secs.push({h:'Veli görüşmesi notu', ico:I.users(14), note:`Sayın ${st.parentName}; ${first} ${momTxt}. ${A.strengths[0]?A.strengths[0].s.name+' dersindeki başarısı belirgin':'Dersler arası dengesi iyi'}${A.weaks[0]?', '+A.weaks[0].s.name+' dersinde ise evde kısa günlük tekrarlarla destek olabilirsiniz':''}. Sorularınız için rehber öğretmenle görüşme planlayabilirsiniz.`});
  }
  return secs;
}

async function openInsight(sid,mode){
  const A=analyze(sid);
  const title=mode==='veli'?'Veli Görüşme Özeti':mode==='veli-self'?'AI Veli Özeti':'AI Gelişim Raporu';
  modalRoot.innerHTML=`<div class="modal-veil" data-act="modal-close">
    <div class="sheet" data-stop>
      <div class="sheet-head">
        <div style="width:34px;height:34px;border-radius:9px;background:var(--sunken);color:var(--violet);display:flex;align-items:center;justify-content:center">${I.sparkles(18)}</div>
        <div><h3>${title}</h3><div class="sub">${esc(A.st.name)} · ${A.st.cls} · ${A.ser.length} deneme verisiyle üretildi</div></div>
        <span style="flex:1"></span><button class="icon-btn" data-act="modal-close">${I.x(17)}</button></div>
      <div class="sheet-body" id="ins-body"><div class="typing"><i></i><i></i><i></i></div></div>
      <div class="sheet-foot"><span class="xs mut3" style="margin-right:auto;align-self:center">Demo — rapor kurgusal veriden otomatik üretildi</span>
        <button class="btn ghost" data-act="modal-close">Kapat</button>
        <button class="btn primary" data-act="ins-copy">${I.doc(15)} Panoya kopyala</button></div>
    </div></div>`;
  const body=document.getElementById('ins-body');
  const secs=insightHTML(A,mode);
  // kopyalama, animasyon bitmeden de doğru içeriği alsın
  window._lastInsight=secs.map(s=>s.h+'\n'+(s.p||s.note||(s.list||[]).map(x=>'• '+x).join('\n'))).join('\n\n');
  await sleep(700);
  body.innerHTML='';
  for(const sec of secs){
    if(!body.isConnected) return;
    const div=document.createElement('div');
    div.className='ins-sec '+(sec.cls||'');
    div.innerHTML=`<h4>${sec.ico} ${sec.h}</h4>`;
    body.appendChild(div);
    if(sec.p){
      const p=document.createElement('p'); div.appendChild(p);
      await typeInto(p,sec.p);
    } else if(sec.list){
      const ul=document.createElement('ul'); div.appendChild(ul);
      for(const item of sec.list){
        const li=document.createElement('li'); const span=document.createElement('span');
        li.appendChild(span); ul.appendChild(li);
        await typeInto(span,item,6);
      }
    } else if(sec.note){
      const nd=document.createElement('div'); nd.className='ins-note'; div.appendChild(nd);
      await typeInto(nd,sec.note);
    }
    await sleep(140);
  }
  window._lastInsight=secs.map(s=>s.h+'\n'+(s.p||s.note||(s.list||[]).map(x=>'• '+x).join('\n'))).join('\n\n');
}
async function typeInto(el,text,cps=4){
  const caret=document.createElement('span'); caret.className='caret';
  el.parentNode.appendChild(caret);
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){ el.textContent=text; caret.remove(); return; }
  for(let i=0;i<text.length;i+=cps){
    if(!el.isConnected){caret.remove();return;}
    el.textContent=text.slice(0,i+cps);
    const sb=el.closest('.sheet-body'); if(sb) sb.scrollTop=sb.scrollHeight;
    await sleep(12);
  }
  el.textContent=text; caret.remove();
}

  const qw=f.split(/[^a-z0-9]+/).filter(Boolean);   // kelime bazlı eşleşme ("durum" ≠ "Duru")
  const student=STUDENTS.find(s=>f.includes(TRfold(s.name))) ||
    STUDENTS.find(s=>{const parts=TRfold(s.name).split(' ');return parts.some(p=>p.length>3&&qw.includes(p));});
  // --- excel / yükleme ---
  if(/excel|xlsx|dosya|yukle|ice aktar|pdf/.test(f)){
    return {html:`<p>Tabii — sonuç dosyasını içe aktarma sihirbazını açıyorum. Dosyayı bıraktığında sınav, sınıf ve öğrencileri otomatik eşleştireceğim.</p>`,
      card:`<div class="m-card"><button class="btn primary" data-act="wizard">${I.upload(15)} İçe aktarma sihirbazını aç</button></div>`};
  }
  // --- karşılaştırma (tam ad eşleşmesi öncelikli) ---
  if(/karsilastir|kiyasla|\bvs\b/.test(f)){
    const found=STUDENTS.map(s=>{const n=TRfold(s.name);
        return {s, sc: f.includes(n)?2 : n.split(' ').some(p=>p.length>3&&qw.includes(p))?1:0};})
      .filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,2).map(x=>x.s);
    if(found.length===2){
      const [a,b]=found.map(s=>analyze(s.id));
      const row=(lab,va,vb,better)=>`<tr><td class="mut sm">${lab}</td><td class="r w700 num" ${better===0?'style="color:var(--good)"':''}>${va}</td><td class="r w700 num" ${better===1?'style="color:var(--good)"':''}>${vb}</td></tr>`;
      return {html:`<p><b>${esc(a.st.name)}</b> ile <b>${esc(b.st.name)}</b> karşılaştırması (son deneme + dönem geneli):</p>`,
        card:`<div class="m-card"><div class="tbl-wrap"><table class="mini-tbl">
        <thead><tr><th></th><th class="r">${esc(a.st.name.split(' ')[0])}</th><th class="r">${esc(b.st.name.split(' ')[0])}</th></tr></thead><tbody>
        ${row('Son net',fmt1(a.last.r.net),fmt1(b.last.r.net),a.last.r.net>=b.last.r.net?0:1)}
        ${row('Ortalama net',fmt1(a.avgNet),fmt1(b.avgNet),a.avgNet>=b.avgNet?0:1)}
        ${row('LGS puanı',fmt1(a.last.r.lgs),fmt1(b.last.r.lgs),a.last.r.lgs>=b.last.r.lgs?0:1)}
        ${row('Sınıf sırası',a.rk.cls+'.',b.rk.cls+'.',a.rk.cls<=b.rk.cls?0:1)}
        ${row('Dönem ivmesi',(a.momentum>=0?'+':'')+fmt1(a.momentum),(b.momentum>=0?'+':'')+fmt1(b.momentum),a.momentum>=b.momentum?0:1)}
        </tbody></table></div>
        <p class="sm mut" style="margin-top:10px">${esc(a.momentum>b.momentum?a.st.name.split(' ')[0]+' daha güçlü bir ivmede':b.st.name.split(' ')[0]+' daha güçlü bir ivmede')}; puan bazında ${esc(a.last.r.lgs>=b.last.r.lgs?a.st.name.split(' ')[0]:b.st.name.split(' ')[0])} önde.</p></div>`};
    }
  }
  // --- veli görüşmesi ---
  if(student && /veli|gorusme|toplanti|aile/.test(f)){
    const A=analyze(student.id);
    return {html:`<p><b>${esc(student.name)}</b> için veli görüşme özeti hazır. Konuşmada şu üç noktayı öne çıkarmanı öneririm:</p><ul>
      <li>${A.momentum>=0?`Dönem ivmesi olumlu: son denemeler ilk yarıya göre <b>+${fmt1(A.momentum)} net</b>.`:`Son denemelerde <b>${fmt1(A.momentum)} netlik</b> düşüş var — nedenini birlikte anlamaya çalışın.`}</li>
      <li>${A.strengths[0]?`<b>${A.strengths[0].s.name}</b> güçlü ders — takdirle başlayın.`:'Dersler arası denge iyi — genel tabloyu övün.'}</li>
      <li>${A.weaks[0]?`<b>${A.weaks[0].s.name}</b> için evde kısa günlük tekrar isteyin.`:'Belirgin zayıf ders yok; hedefi bir üst bandda tutun.'}</li></ul>
      <p>Tam raporu açmak için:</p>`,
      card:stuMiniCard(student.id)};
  }
  // --- tek öğrenci durumu (ders dalından ÖNCE: "Öztürk" gibi soyadlar 'tur' kısaltmasına yakalanmasın) ---
  if(student){
    const A=analyze(student.id);
    return {html:`<p><b>${esc(student.name)}</b> ${A.momentum>1.5?'gayet iyi bir ivmede':A.momentum<-1.5?'son denemelerde zorlanıyor':'istikrarlı gidiyor'}. Son denemede <b>${fmt1(A.last.r.net)} net</b> (${fmt1(A.last.r.lgs)} LGS puanı) yaptı; sınıfında <b>${A.rk.cls}.</b>, okulda <b>${A.rk.sch}.</b> sırada.</p><ul>
      ${A.strengths[0]?`<li>Güçlü: <b>${A.strengths[0].s.name}</b> (sınıf ort. +${fmt1(A.strengths[0].diff)})</li>`:''}
      ${A.weaks[0]?`<li>Gelişmeli: <b>${A.weaks[0].s.name}</b> (sınıf ort. −${fmt1(Math.abs(A.weaks[0].diff))})</li>`:''}
      <li>Dönem ivmesi: <b>${A.momentum>=0?'+':''}${fmt1(A.momentum)} net</b> · profil ${A.consistency}</li></ul>`,
      card:stuMiniCard(student.id)};
  }
  // --- ders + sınıf ortalaması (ders kısaltması yalnız ayrı kelime olarak eşleşir) ---
  const subj=SUBJECTS.find(s=>f.includes(TRfold(s.name))||qw.includes(TRfold(s.short)));
  const cls=CLASSES.find(c=>f.includes(TRfold(c))||f.includes(TRfold(c.replace('-',''))));
  if(subj||cls){
    const le=lastExam(); const st2=EXAM_STATS[le.id];
    if(subj&&cls){
      const v=st2.classAvg[cls].subj[subj.key]; const sv=st2.schoolAvg.subj[subj.key];
      return {html:`<p><b>${cls}</b> sınıfının <b>${subj.name}</b> ortalaması son denemede (${esc(examName(le))}) <b>${fmt1(v)} / ${subj.max} net</b>.</p><p>Okul ortalaması ${fmt1(sv)} — ${cls} ${v>=sv?`okulun <b style="color:var(--good)">${fmt1(v-sv)} net üzerinde</b>`:`okulun <b style="color:var(--bad)">${fmt1(sv-v)} net altında</b>`}.</p>`,
        card:`<div class="m-card">${groupBars(CLASSES.map(c=>({label:c,a:st2.classAvg[c].subj[subj.key],color:c===cls?'var(--accent)':'var(--ink3)'})),{w:420,h:150,max:subj.max})}<div class="xs mut c" style="text-align:center;margin-top:4px">${subj.name} · şube ortalamaları</div></div>`};
    }
    if(subj){
      const sv=st2.schoolAvg.subj[subj.key];
      return {html:`<p>Okul genelinde <b>${subj.name}</b> ortalaması son denemede <b>${fmt1(sv)} / ${subj.max} net</b>. Şube kırılımı:</p>`,
        card:`<div class="m-card">${groupBars(CLASSES.map(c=>({label:c,a:st2.classAvg[c].subj[subj.key]})),{w:420,h:150,max:subj.max})}</div>`};
    }
    const ca=st2.classAvg[cls];
    return {html:`<p><b>${cls}</b> son denemede <b>${fmt1(ca.net)} net</b> ortalama yaptı (LGS ort. ${fmt1(ca.lgs)}). En güçlü ders ${SUBJECTS.reduce((a,s)=>ca.subj[s.key]/s.max>ca.subj[a.key]/a.max?s:a,SUBJECTS[0]).name}.</p>`,
      card:`<div class="m-card">${groupBars(SUBJECTS.map(s=>({label:s.short,a:ca.subj[s.key]})),{w:420,h:150})}<div class="xs mut" style="text-align:center;margin-top:4px">${cls} · ders bazında net ort.</div></div>`};
  }
  // --- en çok gelişen ---
  if(/gelisen|yukselen|ilerleyen|top ?5|en iyi/.test(f)){
    const scored=STUDENTS.map(st=>{
      const ser=studentSeries(st.id); if(ser.length<4) return null;
      const a=ser.slice(0,3).reduce((x,y)=>x+y.r.net,0)/3, b=ser.slice(-3).reduce((x,y)=>x+y.r.net,0)/3;
      return {st,d:+(b-a).toFixed(1)};}).filter(Boolean).sort((a,b)=>b.d-a.d).slice(0,5);
    return {html:`<p>Son 3 denemeyi ilk 3 denemeyle kıyasladığımda en çok gelişen 5 öğrenci:</p>`,
      card:`<div class="m-card"><div class="tbl-wrap"><table class="mini-tbl"><thead><tr><th>#</th><th>Öğrenci</th><th>Sınıf</th><th class="r">Net artışı</th></tr></thead><tbody>
      ${scored.map((x,i)=>`<tr class="rowlink" data-act="open-stu" data-id="${x.st.id}"><td class="mut">${i+1}</td><td class="w600">${esc(x.st.name)}</td><td><span class="pill mut">${x.st.cls}</span></td><td class="r"><span class="delta up">${I.up(12)}+${fmt1(x.d)}</span></td></tr>`).join('')}
      </tbody></table></div><p class="xs mut" style="margin-top:8px">Satıra tıklayarak profile gidebilirsin.</p></div>`};
  }
  // --- okul geneli ---
  if(/okul|genel|ortalama|durum|nasil/.test(f)){
    const le=lastExam(); const st2=EXAM_STATS[le.id];
    return {html:`<p>Okulun son deneme (${esc(examName(le))}) tablosu: <b>${fmt1(st2.schoolAvg.net)} net</b> ve <b>${fmt1(st2.schoolAvg.lgs)} LGS puanı</b> ortalaması, ${st2.participation}/${STUDENTS.length} katılım.</p>`,
      card:`<div class="m-card">${groupBars(CLASSES.map(c=>({label:c,a:st2.classAvg[c].net})),{w:420,h:150})}<div class="xs mut" style="text-align:center;margin-top:4px">şube bazında net ort.</div></div>`};
  }
  return {html:`<p>Bunu tam çözemedim. Şunları yapabilirim:</p><ul>
    <li>Öğrenci durumu: <i>"Deniz Arslan nasıl gidiyor?"</i></li>
    <li>Veli görüşmesi: <i>"Kerem'in velisi geldi, özet hazırla"</i></li>
    <li>İstatistik: <i>"6-B matematik ortalaması"</i></li>
    <li>Liste: <i>"en çok gelişen 5 öğrenci"</i></li>
    <li>İçe aktarma: <i>"excel yükle"</i></li></ul>`};
}

async function sendChat(text){
  if(!text.trim()||S.chatBusy) return;
  S.chat.push({who:'me',text});
  S.chatBusy=true;
  render(); chatScrollBottom();
  const anchor=document.getElementById('chat-anchor');
  const tmp=document.createElement('div');
  tmp.className='msg bot';
  tmp.innerHTML=`<div class="m-av">${logoSVG(26)}</div><div class="m-body"><div class="typing"><i></i><i></i><i></i></div></div>`;
  anchor.before(tmp); chatScrollBottom();
  await sleep(750+Math.random()*450);
  const ans=aiAnswer(text);
  tmp.remove();
  S.chat.push({who:'bot',html:ans.html,card:ans.card});
  S.chatBusy=false;
  render(); chatScrollBottom();
  const inp=document.getElementById('chat-inp'); if(inp) inp.focus();
}

/* =====================================================================
   GENEL ARAMA (topbar)
   ===================================================================== */
function searchDrop(q){
  const drop=document.getElementById('gsearch-drop'); if(!drop) return;
  const f=TRfold(q||'');
  if(f.length<2){ drop.innerHTML=''; return; }
  const hits=STUDENTS.filter(s=>TRfold(s.name).includes(f)||String(s.no).includes(f)||TRfold(s.cls).includes(f)).slice(0,7);
  drop.innerHTML=`<div class="s-drop">${hits.length?hits.map(s=>{
    const le=lastExam(); const r=resOf(s.id,le.id);
    return `<button class="s-row" data-act="open-stu" data-id="${s.id}">
      ${avatar(s,32)}<div><div class="sr-name">${esc(s.name)}</div><div class="sr-sub">${s.cls} · No ${s.no}</div></div>
      <span class="sr-net num">${r?fmt1(r.net)+' net':'—'}</span></button>`;}).join('')
    :`<div class="s-empty">"${esc(q)}" ile eşleşen öğrenci yok</div>`}</div>`;
}

/* =====================================================================
   RENDER + OLAYLAR
   ===================================================================== */
function currentView(){
  switch(S.route){
    case 'dash': return teacherDash();
    case 'students': return studentsView();
    case 'detail': return studentDetail(S.params.id, S.role==='admin'?'admin':'teacher');
    case 'exams': return examsView();
    case 'examdetail': return examDetail(S.params.id);
    case 'entry': return entryView();
    case 'chat': return chatView();
    case 'myhome': return myHome();
    case 'myexams': return myExams();
    case 'phome': return parentHome();
    case 'pexams': return parentExams();
    case 'adash': return adminDash();
    case 'aclasses': return adminClasses();
    case 'atree': return adminTree();
    default: return teacherDash();
  }
}
function render(){
  root.innerHTML = S.role? shell(currentView()) : loginView();
  afterRender();
}
function afterRender(){
  // giriş ekranı efektleri (aurora / yörünge / tilt)
  if(!S.role) initLoginFX(); else stopLoginFX();
  // sayaç animasyonu
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.querySelectorAll('[data-count]').forEach(el=>{
    const target=parseFloat(el.dataset.count), dec=+(el.dataset.dec||0);
    const unit=el.querySelector('.k-unit,.unit'); const unitHTML=unit?unit.outerHTML:'';
    const show=v=>{el.innerHTML=(dec?v.toLocaleString('tr-TR',{minimumFractionDigits:dec,maximumFractionDigits:dec}):Math.round(v).toLocaleString('tr-TR'))+unitHTML;};
    if(reduced){show(target);return;}
    const t0=performance.now(), dur=700;
    const tick=t=>{const p=Math.min(1,(t-t0)/dur);show(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
  });
  // arama
  const gs=document.getElementById('gsearch');
  if(gs){
    if(IS_TOUCH){ gs.readOnly=true; gs.setAttribute('inputmode','none');
      gs.addEventListener('click',()=>{ gs.blur(); go(S.role==='admin'?'atree':'students'); });
    } else {
      gs.addEventListener('input',()=>searchDrop(gs.value));
      gs.addEventListener('keydown',e=>{if(e.key==='Escape'){gs.value='';searchDrop('');}});
    }
  }
  // liste araması odak koru
  const lq=document.getElementById('list-q');
  if(lq&&!IS_TOUCH){ lq.addEventListener('input',()=>{S.ui.listQ=lq.value;S.ui.listPage=1;
    const wrap=root.querySelector('.view'); if(!wrap) return;
    // yalnız tabloyu tazele: basitlik için tam render + odak restore
    const pos=lq.selectionStart; render();
    const nq=document.getElementById('list-q'); if(nq){nq.focus();nq.setSelectionRange(pos,pos);} }); }
  // chat input
  const ci=document.getElementById('chat-inp');
  if(ci){
    if(IS_TOUCH){
      ci.readOnly=true; ci.setAttribute('inputmode','none');
      ci.addEventListener('click',()=>{ ci.blur(); if(!S.chatBusy){ window._sugIx=((window._sugIx??-1)+1)%CHAT_SUGS.length; sendChat(CHAT_SUGS[window._sugIx]); } });
    } else {
      ci.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const v=ci.value; ci.value=''; sendChat(v);} });
      if(S.route==='chat'&&!S.chatBusy) ci.focus({preventScroll:true});
    }
  }
  // manuel giriş hücreleri
  root.querySelectorAll('.cell-inp').forEach(inp=>{
    if(IS_TOUCH){ inp.readOnly=true; inp.setAttribute('inputmode','none'); }
    else inp.addEventListener('focus',()=>inp.select());   // dolu hücrede maxlength yazmayı engellemesin
    inp.addEventListener('input',()=>{
      const sid=+inp.dataset.sid; const subj=SUBJECTS.find(s=>s.key===S.ui.entrySubj);
      const row=inp.closest('tr');
      const dEl=row.querySelector('[data-entry="d"]'), yEl=row.querySelector('[data-entry="y"]');
      const rawD=parseInt(dEl.value), rawY=parseInt(yEl.value);
      let d=clamp(rawD||0,0,subj.max), y=clamp(rawY||0,0,subj.max);
      if(!isNaN(rawD)&&rawD!==d) dEl.value=d;
      if(!isNaN(rawY)&&rawY!==y) yEl.value=y;
      if(d+y>subj.max){ y=subj.max-d; yEl.value=y; }
      const b=subj.max-d-y, net=d-y/3;
      const bEl=document.getElementById('b-'+sid), nEl=document.getElementById('n-'+sid);
      if(bEl) bEl.textContent=b;
      if(nEl) nEl.textContent=fmt1(net);
    });
  });
  // sınav seçici (manuel giriş)
  root.querySelectorAll('[data-act-change="entry-exam"]').forEach(sel=>{
    sel.addEventListener('change',()=>{S.ui.entryExam=+sel.value;render();});
  });
  chatScrollBottom();
}

/* --- tıklama delegasyonu --- */
document.addEventListener('click',e=>{
  const stop=e.target.closest('[data-stop]');
  const el=e.target.closest('[data-act]');
  if(!el){ // dış tıklama: arama açılır listesini kapat
    if(!e.target.closest('.tb-search')) { const d=document.getElementById('gsearch-drop'); if(d) d.innerHTML=''; }
    return;
  }
  // data-stop içindeki tıklama, dıştaki veil'in data-act'ine yürümesin
  if(stop && el.contains(stop) && el!==stop) return;
  const a=el.dataset;
  const acts={
    'login':   ()=>setRole(a.role),
    'logout':  ()=>{S.role=null;render();window.scrollTo({top:0});},
    'nav':     ()=>go(a.r),
    'side':    ()=>{S.sideOpen=!S.sideOpen;render();},
    'theme':   ()=>{document.documentElement.dataset.theme = isDarkNow()?'light':'dark'; render();},
    'open-stu':()=>{ if(S.role==='student'||S.role==='parent') return;
       modalRoot.innerHTML=''; go('detail',{id:+a.id}); },
    'open-exam':()=>{S.ui.histCls='all'; go('examdetail',{id:+a.id});},
    'dash-cls':()=>{S.ui.dashCls=a.c;render();},
    'list-cls':()=>{S.ui.listCls=a.c;S.ui.listPage=1;render();},
    'list-page':()=>{S.ui.listPage=+a.p;render();},
    'hist-cls':()=>{S.ui.histCls=a.c;render();},
    'detail-subj':()=>{S.ui.detailSubj=a.s;render();},
    'entry-cls':()=>{S.ui.entryCls=a.c;render();},
    'entry-subj':()=>{S.ui.entrySubj=a.s;render();},
    'entry-save':()=>{
      // girilen D/Y değerlerini gerçekten veriye işle: net, LGS ve sıralamalar yeniden hesaplanır
      const exam=EXAM_LIST.find(e=>e.id===S.ui.entryExam)||lastExam();
      const subj=SUBJECTS.find(s=>s.key===S.ui.entrySubj);
      let changed=0;
      root.querySelectorAll('[data-entry="d"]').forEach(dEl=>{
        if(dEl.disabled) return;
        const sid=+dEl.dataset.sid; const r=RESULTS[exam.id][sid]; if(!r) return;
        const yEl=dEl.closest('tr').querySelector('[data-entry="y"]');
        const d=clamp(parseInt(dEl.value)||0,0,subj.max);
        let y=clamp(parseInt(yEl.value)||0,0,subj.max);
        if(d+y>subj.max) y=subj.max-d;
        const old=r.subj[subj.key];
        if(old.d===d&&old.y===y) return;
        changed++;
        r.subj[subj.key]={d,y,b:subj.max-d-y,net:+(d-y/3).toFixed(2)};
        r.totD=SUBJECTS.reduce((a,s)=>a+r.subj[s.key].d,0);
        r.totY=SUBJECTS.reduce((a,s)=>a+r.subj[s.key].y,0);
        r.net=+SUBJECTS.reduce((a,s)=>a+r.subj[s.key].net,0).toFixed(2);
        const wnet=SUBJECTS.reduce((a,s)=>a+r.subj[s.key].net*s.coef,0);
        r.lgs=+clamp(100+400*(wnet/WMAX),100,500).toFixed(3);
      });
      if(changed){ recomputeStats(exam);
        toast(`${S.ui.entryCls} · ${subj.short} kaydedildi — ${changed} öğrenci güncellendi, sıralamalar yenilendi`); render(); }
      else toast('Değişiklik yok', I.info(15));
    },
    
    'entry-reset':()=>render(),
    'wizard':  ()=>{ if(S.ui.imported){toast('Türkiye Geneli 5 zaten içe aktarıldı',I.info(15));return;} openWizard(); },
    'wiz-start':()=>runWizard(),
    'wiz-import':()=>doImport(),
    'modal-close':()=>{modalRoot.innerHTML='';},
    'insight': ()=>openInsight(+a.id, a.mode||'full'),
    'ins-copy':()=>{ if(navigator.clipboard&&window._lastInsight) navigator.clipboard.writeText(window._lastInsight).catch(()=>{});
       toast('Rapor panoya kopyalandı'); },
    'ask-ai':  ()=>{ const st=stById(+a.id); go('chat'); sendChat(`${st.name} nasıl gidiyor?`); },
    'sug':     ()=>sendChat(a.q),
    'chat-send':()=>{ const ci=document.getElementById('chat-inp'); if(ci){const v=ci.value;ci.value='';sendChat(v);} },
    'tree':    ()=>{S.ui.treeOpen[a.c]=!S.ui.treeOpen[a.c];render();},
  };
  if(acts[a.act]) acts[a.act]();
});

/* --- başlat --- */
document.documentElement.lang='tr';   // text-transform:uppercase Türkçe kurallarıyla çalışsın (İ/ı)
if(!document.documentElement.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
  document.documentElement.dataset.theme='dark';
render();
</script>
